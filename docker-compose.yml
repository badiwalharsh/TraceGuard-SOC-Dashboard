version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: traceguard-db
    restart: always
    environment:
      POSTGRES_USER: traceguard_admin
      POSTGRES_PASSWORD: traceguard_secure_pass_2026
      POSTGRES_DB: traceguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
